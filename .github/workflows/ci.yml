name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------
  # JOB 1: Landing (React + TypeScript)
  # -------------------------------------------------------
  landing:
    name: Landing — Lint, Typecheck, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./causa-landing # ajusta al nombre de tu carpeta

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: causa-landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: landing-coverage
          path: causa-landing/coverage/

      - name: Build
        run: npm run build

      - name: E2E tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: causa-landing/playwright-report/
